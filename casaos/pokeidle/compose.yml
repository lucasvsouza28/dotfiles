x-poke: &poke
  image: lscr.io/linuxserver/chromium:latest
  restart: unless-stopped
  shm_size: "1gb"
  mem_limit: 1g
  security_opt:
    - seccomp:unconfined
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: America/Sao_Paulo
    CHROME_CLI: >-
      --load-extension=/ext
      --use-gl=swiftshader
      --no-first-run
      --no-default-browser-check
      https://pokeidle.io

services:
  poke1:
    <<: *poke
    container_name: poke1
    ports: ["3001:3001"]   # https://<pi>:3001
    volumes:
      - ./data/acc1:/config
      - ./ext:/ext:ro
  poke2:
    <<: *poke
    container_name: poke2
    ports: ["3002:3001"]
    volumes:
      - ./data/acc2:/config
      - ./ext:/ext:ro
  poke3:
    <<: *poke
    container_name: poke3
    ports: ["3003:3001"]
    volumes:
      - ./data/acc3:/config
      - ./ext:/ext:ro
  poke4:
    <<: *poke
    container_name: poke4
    ports: ["3004:3001"]
    volumes:
      - ./data/acc4:/config
      - ./ext:/ext:ro
